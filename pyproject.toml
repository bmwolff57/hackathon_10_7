[project]
name = "hackathon-10-7"
version = "0.1.0"
description = "Hackathon project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["round1", "round1.*", "round2", "round2.*", "round3", "round3.*"]
namespaces = false
